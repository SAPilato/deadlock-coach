<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deadlock Coach</title>
    <script>
      // Apply the theme before the first paint (lib/theme.ts owns the list and the tones).
      var t = "deco";
      try {
        t = localStorage.getItem("coach.theme.v2") || t;
      } catch (e) {}
      document.documentElement.dataset.theme = t;
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
