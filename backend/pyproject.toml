[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deadlock-coach-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "polars>=1.0",
  "boon-deadlock>=0.19",
  "python-multipart>=0.0.9",
  "zstandard>=0.22; python_version < '3.14'",  # 3.14+ has compression.zstd built in
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.seed" = ["data/*.json.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
